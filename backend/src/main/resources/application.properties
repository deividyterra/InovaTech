spring.application.name=inovatech

spring.datasource.url=${DB_URL:jdbc:postgresql://[::1]:5432/inovatech}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
# Chave para assinar os tokens (mínimo de 32 caracteres).
# Em produção, defina a variável de ambiente JWT_SECRET; o valor padrão serve apenas para desenvolvimento.
jwt.secret=${JWT_SECRET:inovatech-chave-de-desenvolvimento-troque-em-producao}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}
